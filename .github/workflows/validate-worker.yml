name: Validate Worker source
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/validate-worker.yml"
  pull_request:
    paths:
      - "src/**"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/index.js
